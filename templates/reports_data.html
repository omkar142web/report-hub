<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Auth Management</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <a href="{{ url_for('reports') }}" class="clinic-logo">ADMIN 🔑</a>
      <a href="{{ url_for('logout') }}" class="logout">Logout</a>
    </div>

    <!-- MAIN -->
    <div class="main">
      <div class="admin-header-row">
        <h1>🔐 Auth Management</h1>
        <button class="btn success add-btn" onclick="openAddModal()">
          ➕ Add New
        </button>
      </div>

      <!-- FILTER BAR (replaces search) -->
      <div class="search-box admin-filter-bar">
        <button id="filterToggle" class="btn">
          🔁 View: Hospital → Doctors
        </button>
      </div>
<div id="addModal" class="modal hidden">
  <div class="modal-box">
    <h3 style="margin-top: 0; margin-bottom: 20px;">Add New Entity</h3>

    <!-- TYPE -->
    <div style="margin-bottom: 20px;">
      <label style="display:block; color:#94a3b8; font-size:0.85rem; margin-bottom:8px; font-weight:600;">
        I want to add a:
      </label>
      <select id="addType" class="input" onchange="updateAddForm()" style="cursor:pointer;">
        <option value="hospital">🏥 New Hospital</option>
        <option value="doctor">👨‍⚕️ New Doctor (to existing hospital)</option>
      </select>
    </div>

    <!-- HOSPITAL SECTION -->
    <div id="hospitalSection">
      <input id="hospitalCode" class="input"
             placeholder="Hospital Code (e.g. apollo_mumbai)" required>
      <input id="hospitalPassword" type="password" class="input"
             placeholder="Hospital Password" required>

      <div class="divider"><span>Optional: Add Doctors</span></div>

      <div id="doctorList"></div>

      <button class="btn secondary-btn" onclick="addDoctorRow()">
        ➕ Add Doctor Row
      </button>
    </div>

    <!-- DOCTOR ONLY SECTION -->
    <div id="doctorSection" class="hidden">
      <input id="doctorCode" class="input"
             placeholder="Doctor Code (e.g. dr_smith)" required>

      <select id="doctorHospital" class="input" style="cursor:pointer;">
        <option value="">Select Hospital</option>
      </select>

      <input id="doctorPassword" type="password" class="input"
             placeholder="Doctor Password" required>
    </div>

    <div class="modal-actions" style="margin-top: 25px;">
      <button class="btn danger" onclick="closeAddModal()">Cancel</button>
      <button class="btn success" onclick="submitAdd()">Add</button>
    </div>
  </div>
</div>



      <!-- DATA CONTAINER -->
      <div id="dataContainer" class="admin-grid"></div>

    </div>
  </div>

  <script>
    const auth = {{ auth | tojson }};
    const hospitalMap = {};

  let currentTarget = null;

  // 1️⃣ Add ALL hospitals (even empty)
for (const hospital in auth.hospitals) {
  hospitalMap[hospital] = [];
}

// 2️⃣ Attach doctors to hospitals
for (const doctor in auth.doctors) {
  const hospital = auth.doctors[doctor].hospital;
  if (!hospitalMap[hospital]) hospitalMap[hospital] = [];
  hospitalMap[hospital].push(doctor);
}


  let viewMode = "hospital_doctors";
  const container = document.getElementById("dataContainer");
  const toggleBtn = document.getElementById("filterToggle");

  function openModal(type, id) {
    currentTarget = { type, id };
    document.getElementById("modalTitle").innerText =
      `Change ${type} password`;
    document.getElementById("newPassword").value = "";
    document.getElementById("passwordModal").classList.remove("hidden");
  }

  function closeModal() {
    document.getElementById("passwordModal").classList.add("hidden");
  }

  async function submitPassword() {
  const pw = document.getElementById("newPassword").value.trim();
  const confirm = document.getElementById("confirmPassword").value.trim();

  if (!pw) {
    alert("Password required");
    return;
  }

  if (pw !== confirm) {
    alert("Passwords do not match");
    return;
  }

  const res = await fetch("/api/change-password", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      type: currentTarget.type,
      id: currentTarget.id,
      new_password: pw,
    }),
  });

  const data = await res.json();
  if (data.success) {
    closeModal();
    alert("Password updated successfully");
  } else {
    alert(data.error || "Failed");
  }
}

  function renderHospitalDoctors() {
    container.innerHTML = "";
    for (const hospital in hospitalMap) {
      const block = document.createElement("div");
      block.className = "admin-card";


      let html = `
  <div class="admin-hospital-header">
    <div class="admin-hospital-name">
      🏥 ${hospital.replaceAll("_"," ")}
    </div>

    <button class="btn-icon danger" title="Delete Hospital"
      onclick="deleteEntity('hospital','${hospital}')">
      🗑️
    </button>
  </div>
`;



      hospitalMap[hospital].forEach(doc => {
          html += `
            <div class="admin-doctor-row">
              <span class="admin-doctor-name">👨‍⚕️ ${doc.replaceAll("_", " ")}</span>

              <div class="admin-actions">
                <button class="btn-icon" title="Change Password"
                  onclick="openModal('doctor','${doc}')">
                  🔑
                </button>

                <button class="btn-icon danger" title="Delete Doctor"
                  onclick="deleteEntity('doctor','${doc}')">
                  🗑️
                </button>
              </div>
            </div>
          `;
      });


      block.innerHTML = html;
      container.appendChild(block);
    }
  }

  function renderHospitalsOnly() {
    container.innerHTML = "";
    for (const hospital in hospitalMap) {
      const block = document.createElement("div");
      block.className = "admin-card";


      block.innerHTML = `
  <div class="admin-hospital-header">
    <div class="admin-hospital-name">🏥 ${hospital.replaceAll("_"," ")}</div>
    <div class="admin-actions">
      <button class="btn-icon" title="Change Password"
        onclick="openModal('hospital','${hospital}')">
        🔑
      </button>
      <button class="btn-icon danger" title="Delete Hospital"
        onclick="deleteEntity('hospital','${hospital}')">
        🗑️
      </button>
    </div>
  </div>

`;


      container.appendChild(block);
    }
  }

  toggleBtn.onclick = () => {
    if (viewMode === "hospital_doctors") {
      viewMode = "hospitals_only";
      toggleBtn.innerText = "🔁 View: Hospitals Only";
      renderHospitalsOnly();
    } else {
      viewMode = "hospital_doctors";
      toggleBtn.innerText = "🔁 View: Hospital → Doctors";
      renderHospitalDoctors();
    }
  };

  renderHospitalDoctors();
</script>

<script>
async function deleteEntity(type, id) {
  if (!confirm(`Delete ${type}: ${id}?`)) return;

  const res = await fetch("/api/delete-entity", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ type, id })
  });

  const data = await res.json();
  if (data.success) {
    alert("Deleted successfully");
    location.reload();
  } else {
    alert(data.error || "Failed");
  }
}
</script>





<!-- PASSWORD MODAL -->
<div id="passwordModal" class="modal hidden">
  <div class="modal-box">
    <h3 id="modalTitle">Change Password</h3>

    <input type="password" id="newPassword" placeholder="New password" class="input" />
<input type="password" id="confirmPassword" placeholder="Confirm password" class="input" />
<small id="pwHint" style="opacity:0.7;"></small>


    <div class="modal-actions">
      <button class="btn danger" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="submitPassword()">Save</button>
    </div>
  </div>
</div>

<br>
<div style="font-size:12px;opacity:0.7;margin-bottom:8px;">&nbsp;&nbsp;
  Logged in as: <strong>ADMIN</strong>
</div>


<script>
function openAddModal() {
  document.getElementById("addModal").classList.remove("hidden");
  // Reset form
  document.getElementById("addType").value = "hospital";
  document.getElementById("hospitalCode").value = "";
  document.getElementById("hospitalPassword").value = "";
  document.getElementById("doctorList").innerHTML = "";
  document.getElementById("doctorCode").value = "";
  document.getElementById("doctorPassword").value = "";
  updateAddForm();
}

function closeAddModal() {
  document.getElementById("addModal").classList.add("hidden");
}

function updateAddForm() {
  const type = document.getElementById("addType").value;
  document.getElementById("hospitalSection").classList.toggle("hidden", type !== "hospital");
  document.getElementById("doctorSection").classList.toggle("hidden", type !== "doctor");

  if (type === "doctor") {
    const select = document.getElementById("doctorHospital");
    select.innerHTML = `<option value="">Select hospital</option>`;
    // Sort hospitals for better UX
    Object.keys(auth.hospitals).sort().forEach(h => {
      select.innerHTML += `<option value="${h}">${h.replaceAll("_", " ")}</option>`
    });
  }
}

function addDoctorRow() {
  const div = document.createElement("div");
  div.className = "doctor-row-dynamic";
  div.innerHTML = `
    <input class="input doctor-code" placeholder="Dr. Code" required>
    <input class="input doctor-password" type="password" placeholder="Password" required>
    <button class="btn-icon danger" onclick="this.parentElement.remove()" title="Remove" style="width:36px; height:36px; flex-shrink:0;">✕</button>
  `;
  document.getElementById("doctorList").appendChild(div);
}

async function submitAdd() {
  const type = document.getElementById("addType").value;

  if (type === "hospital") {
    const hospital = document.getElementById("hospitalCode").value.trim();
    const password = document.getElementById("hospitalPassword").value.trim();

    if (!hospital || !password) {
      alert("Hospital code and password required");
      return;
    }

    await fetch("/api/add-entity", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        type: "hospital",
        id: hospital,
        password
      })
    });

    // optional doctors
    const rows = document.querySelectorAll(".doctor-row-dynamic");
    for (const row of rows) {
      const code = row.querySelector(".doctor-code").value.trim();
      const pw = row.querySelector(".doctor-password").value.trim();
      
      if (code && pw) {
      fetch("/api/add-entity", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          type: "doctor",
            id: code,
          hospital,
            password: pw
        })
      });
      }
    }

  } else {
    const doctor = document.getElementById("doctorCode").value.trim();
    const hospital = document.getElementById("doctorHospital").value;
    const password = document.getElementById("doctorPassword").value.trim();

    if (!doctor || !hospital || !password) {
      alert("All fields required");
      return;
    }

    await fetch("/api/add-entity", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        type: "doctor",
        id: doctor,
        hospital,
        password
      })
    });
  }

  alert("Added successfully");
  location.reload();
}
</script>



</body>
</html>

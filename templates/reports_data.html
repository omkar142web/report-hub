<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Auth Management</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <a href="{{ url_for('reports') }}" class="clinic-logo">Clinic</a>
      <a href="{{ url_for('logout') }}" class="logout">Logout</a>
    </div>

    <!-- MAIN -->
    <div class="main">
      <h1>🔐 Auth Management</h1>

      <!-- FILTER BAR (replaces search) -->
      <div class="search-box">
        <button id="filterToggle" class="btn">
          🔁 View: Hospital → Doctors
        </button>
      </div>
      <button class="btn success" onclick="openAddModal()">
  ➕ Add
</button>
<br>
<br>
<br>
<div id="addModal" class="modal hidden">
  <div class="modal-box">
    <h3>Add Hospital / Doctor</h3>

    <!-- TYPE -->
    <select id="addType" class="input" onchange="updateAddForm()">
      <option value="hospital">Hospital</option>
      <option value="doctor">Doctor</option>
    </select>

    <!-- HOSPITAL SECTION -->
    <div id="hospitalSection">
      <input id="hospitalCode" class="input"
             placeholder="Hospital code (apollo_mumbai)" required>

      <!-- <button class="btn" onclick="addDoctorRow()">➕ Add Doctor (optional)</button> -->

      <div id="doctorList"></div>

      <input id="hospitalPassword" type="password" class="input"
             placeholder="Hospital password (required)">
    </div>

    <!-- DOCTOR ONLY SECTION -->
     <div></div>
     <button class="btn" onclick="addDoctorRow()">➕ Add Doctor (optional)</button>
<div><br></div>
    <div id="doctorSection" class="hidden">
      <input id="doctorCode" class="input"
             placeholder="Doctor code (dr_xyz)" required>

      
      <select id="doctorHospital" class="input">
        {% for h in auth.hospitals %}
          <option value="{{ h }}">{{ h }}</option>
        {% endfor %}
      </select>

      <input id="doctorPassword" type="password" class="input"
             placeholder="Doctor password" required>
    </div>

    <div class="modal-actions" style="display: flex; gap: 12px;">
      <button class="btn danger" onclick="closeAddModal()">Cancel</button>
      <button class="btn success" onclick="submitAdd()">Add</button>
    </div>
  </div>
</div>



      <!-- DATA CONTAINER -->
      <div id="dataContainer"></div>

    </div>
  </div>

  <script>
    const auth = {{ auth | tojson }};
    const hospitalMap = {};

  let currentTarget = null;

  // 1️⃣ Add ALL hospitals (even empty)
for (const hospital in auth.hospitals) {
  hospitalMap[hospital] = [];
}

// 2️⃣ Attach doctors to hospitals
for (const doctor in auth.doctors) {
  const hospital = auth.doctors[doctor].hospital;
  if (!hospitalMap[hospital]) hospitalMap[hospital] = [];
  hospitalMap[hospital].push(doctor);
}


  let viewMode = "hospital_doctors";
  const container = document.getElementById("dataContainer");
  const toggleBtn = document.getElementById("filterToggle");

  function openModal(type, id) {
    currentTarget = { type, id };
    document.getElementById("modalTitle").innerText =
      `Change ${type} password`;
    document.getElementById("newPassword").value = "";
    document.getElementById("passwordModal").classList.remove("hidden");
  }

  function closeModal() {
    document.getElementById("passwordModal").classList.add("hidden");
  }

  async function submitPassword() {
  const pw = document.getElementById("newPassword").value.trim();
  const confirm = document.getElementById("confirmPassword").value.trim();

  if (!pw) {
    alert("Password required");
    return;
  }

  if (pw !== confirm) {
    alert("Passwords do not match");
    return;
  }

  const res = await fetch("/api/change-password", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      type: currentTarget.type,
      id: currentTarget.id,
      new_password: pw,
    }),
  });

  const data = await res.json();
  if (data.success) {
    closeModal();
    alert("Password updated successfully");
  } else {
    alert(data.error || "Failed");
  }
}

  function renderHospitalDoctors() {
    container.innerHTML = "";
    for (const hospital in hospitalMap) {
      const block = document.createElement("div");
      block.className = "patient-toggle";

      let html = `
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <strong>🏥 ${hospital.replaceAll("_"," ")}</strong>

    <button class="btn danger"
      onclick="deleteEntity('hospital','${hospital}')">
      Delete Hospital
    </button>
  </div>
  <br>
`;


      hospitalMap[hospital].forEach(doc => {
        html += `
          <div style="margin-left:16px;margin-top:6px;">
            👨‍⚕️ ${doc}

            <button class="btn"
            onclick="openModal('doctor','${doc}')">
            Change Password
            </button>

            <button class="btn danger"
            onclick="deleteEntity('doctor','${doc}')">
            Delete
            </button>

          </div>`;
      });

      block.innerHTML = html;
      container.appendChild(block);
    }
  }

  function renderHospitalsOnly() {
    container.innerHTML = "";
    for (const hospital in hospitalMap) {
      const block = document.createElement("div");
      block.className = "patient-toggle";

      block.innerHTML = `
  <strong>🏥 ${hospital.replaceAll("_"," ")}</strong>

  <button class="btn"
    onclick="openModal('hospital','${hospital}')">
    Change Password
  </button>

  <button class="btn danger"
  onclick="deleteEntity('hospital','${hospital}')">
  Delete
</button>

`;


      container.appendChild(block);
    }
  }

  toggleBtn.onclick = () => {
    if (viewMode === "hospital_doctors") {
      viewMode = "hospitals_only";
      toggleBtn.innerText = "🔁 View: Hospitals Only";
      renderHospitalsOnly();
    } else {
      viewMode = "hospital_doctors";
      toggleBtn.innerText = "🔁 View: Hospital → Doctors";
      renderHospitalDoctors();
    }
  };

  renderHospitalDoctors();
</script>

<script>
async function deleteEntity(type, id) {
  if (!confirm(`Delete ${type}: ${id}?`)) return;

  const res = await fetch("/api/delete-entity", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ type, id })
  });

  const data = await res.json();
  if (data.success) {
    alert("Deleted successfully");
    location.reload();
  } else {
    alert(data.error || "Failed");
  }
}
</script>





<!-- PASSWORD MODAL -->
<div id="passwordModal" class="modal hidden">
  <div class="modal-box">
    <h3 id="modalTitle">Change Password</h3>

    <input type="password" id="newPassword" placeholder="New password" class="input" />
<input type="password" id="confirmPassword" placeholder="Confirm password" class="input" />
<small id="pwHint" style="opacity:0.7;"></small>


    <div class="modal-actions">
      <button class="btn danger" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="submitPassword()">Save</button>
    </div>
  </div>
</div>

<br>
<div style="font-size:12px;opacity:0.7;margin-bottom:8px;">&nbsp;&nbsp;
  Logged in as: <strong>ADMIN</strong>
</div>


<script>
function openAddModal() {
  document.getElementById("addModal").classList.remove("hidden");
}

function closeAddModal() {
  document.getElementById("addModal").classList.add("hidden");
}

async function submitAdd() {
  const type = document.getElementById("addType").value;

  if (type === "hospital") {
    const hospital = hospitalCode.value.trim();
    const hpw = hospitalPassword.value.trim();

    if (!hospital) return alert("Hospital code required");

    // Case: hospital + doctors
    const doctors = document.querySelectorAll(".doctor-row");

    if (doctors.length > 0) {
      await fetch("/api/add-entity", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          type: "hospital",
          id: hospital,
          password: "temp"
        })
      });

      for (const d of doctors) {
        const code = d.querySelector(".doc-code").value.trim();
        const pw = d.querySelector(".doc-password").value.trim();
        if (!code || !pw) return alert("Doctor code & password required");

        await fetch("/api/add-entity", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({
            type: "doctor",
            id: code,
            hospital,
            password: pw
          })
        });
      }
    } else {
      if (!hpw) return alert("Hospital password required");

      await fetch("/api/add-entity", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          type: "hospital",
          id: hospital,
          password: hpw
        })
      });
    }
  }

  if (type === "doctor") {
    const code = doctorCode.value.trim();
    const pw = doctorPassword.value.trim();
    const hospital = doctorHospital.value;

    if (!code || !pw || !hospital)
      return alert("All doctor fields required");

    await fetch("/api/add-entity", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        type: "doctor",
        id: code,
        hospital,
        password: pw
      })
    });
  }

  alert("Added successfully");
  location.reload();
}

</script>


<script>
const hospitals = Object.keys(auth.hospitals);

function onTypeChange() {
  const type = document.getElementById("addType").value;

  document.getElementById("doctorOnly").style.display =
    type === "doctor" ? "block" : "none";

  document.getElementById("askDoctors").style.display =
    type === "hospital" ? "block" : "none";

  document.getElementById("hospitalPassword").style.display =
    type === "hospital" ? "block" : "none";

  if (type === "doctor") {
    const select = document.getElementById("doctorHospital");
    select.innerHTML = `<option value="">Select hospital</option>`;
    hospitals.forEach(h =>
      select.innerHTML += `<option value="${h}">${h}</option>`
    );
  }
}

function addDoctorRow() {
  const container = document.getElementById("doctorList");

  container.innerHTML += `
    <div class="doctor-row">
      <input class="input doc-code" placeholder="Doctor code (dr_xyz)" />
      <input class="input doc-password" type="password" placeholder="Doctor password" />
    </div>
  `;
}
</script>

<script>
function updateAddForm() {
  const type = document.getElementById("addType").value;
  document.getElementById("hospitalSection").classList.toggle("hidden", type !== "hospital");
  document.getElementById("doctorSection").classList.toggle("hidden", type !== "doctor");
}

function addDoctorRow() {
  const div = document.createElement("div");
  div.innerHTML = `
    <input class="input doctor-code" placeholder="Doctor code (dr_xyz)" required>
    <input class="input doctor-password" type="password"
           placeholder="Doctor password" required>
  `;
  document.getElementById("doctorList").appendChild(div);
}

async function submitAdd() {
  const type = document.getElementById("addType").value;

  if (type === "hospital") {
    const hospital = document.getElementById("hospitalCode").value.trim();
    const password = document.getElementById("hospitalPassword").value.trim();

    if (!hospital || !password) {
      alert("Hospital code and password required");
      return;
    }

    await fetch("/api/add-entity", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        type: "hospital",
        id: hospital,
        password
      })
    });

    // optional doctors
    document.querySelectorAll(".doctor-code").forEach((el, i) => {
      fetch("/api/add-entity", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          type: "doctor",
          id: el.value.trim(),
          hospital,
          password: document.querySelectorAll(".doctor-password")[i].value
        })
      });
    });

  } else {
    const doctor = document.getElementById("doctorCode").value.trim();
    const hospital = document.getElementById("doctorHospital").value;
    const password = document.getElementById("doctorPassword").value.trim();

    if (!doctor || !hospital || !password) {
      alert("All fields required");
      return;
    }

    await fetch("/api/add-entity", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        type: "doctor",
        id: doctor,
        hospital,
        password
      })
    });
  }

  alert("Added successfully");
  location.reload();
}
</script>



</body>
</html>
